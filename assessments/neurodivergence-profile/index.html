<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neurodivergence Trait Profile</title>
<meta name="description" content="Research-grounded self/parent-report profile of ADHD, autism-spectrum, sensory, learning and motor traits for adults and 9–10 year olds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F1F4F3; --surface:#FFFFFF; --sunk:#E7ECEB; --ink:#18232E; --ink-2:#3E4B57; --muted:#5E6B76;
  --rule:#D6DDDC; --accent:#2B5A85; --accent-ink:#FFFFFF; --focus:#2B5A85;
  --b0:#E1EAF3; --b1:#BCD0E4; --b2:#85A8CB; --b3:#4B78A6; --pin:#18232E;
  --warn-bg:#FFF4DC; --warn-ink:#6B4A00; --warn-rule:#E8C77A;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#11161B; --surface:#182028; --sunk:#1F2932; --ink:#E4EAEF; --ink-2:#C2CCD4; --muted:#93A1AC;
    --rule:#2A3540; --accent:#8CB5DD; --accent-ink:#0F1A24; --focus:#8CB5DD;
    --b0:#1D2A37; --b1:#27435D; --b2:#3A6690; --b3:#6395C6; --pin:#F2F6F9;
    --warn-bg:#2E2615; --warn-ink:#F0D69A; --warn-rule:#6B5626;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#11161B; --surface:#182028; --sunk:#1F2932; --ink:#E4EAEF; --ink-2:#C2CCD4; --muted:#93A1AC;
  --rule:#2A3540; --accent:#8CB5DD; --accent-ink:#0F1A24; --focus:#8CB5DD;
  --b0:#1D2A37; --b1:#27435D; --b2:#3A6690; --b3:#6395C6; --pin:#F2F6F9;
  --warn-bg:#2E2615; --warn-ink:#F0D69A; --warn-rule:#6B5626;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1,h2,h3{font-family:var(--serif);font-weight:650;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4vw,2.35rem);line-height:1.15}
h2{font-size:1.35rem;line-height:1.25}
h3{font-size:1.05rem;line-height:1.3}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lede{color:var(--ink-2);max-width:68ch;margin-top:10px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.masthead{display:grid;gap:18px}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;background:var(--surface);padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-top:22px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.ghost{border:1px solid var(--rule);background:var(--surface);padding:7px 12px;border-radius:7px;cursor:pointer;font-size:.86rem;font-weight:600}
.ghost:hover{border-color:var(--accent)}

.notice{border:1px solid var(--warn-rule);background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:12px 14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:18px;font-size:.92rem}
.notice strong{font-weight:700}
.fine{font-size:.84rem;color:var(--muted)}

.progress{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:10px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--rule)}
.progress .bar{flex:1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.progress .count{font-size:.82rem;color:var(--muted);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.progress .bar i{transition:none}}

.domain{margin-top:34px}
.domain > header{display:grid;gap:6px;margin-bottom:10px}
.domain > header p{color:var(--muted);font-size:.9rem;max-width:70ch}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px;align-items:center;padding:14px 0;border-top:1px solid var(--rule)}
.q:last-child{border-bottom:1px solid var(--rule)}
.q .qt{display:grid;gap:3px}
.q .qn{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.q .src{font-size:.76rem;color:var(--muted);display:none}
.show-src .q .src{display:block}
.q.unanswered .qn::after{content:" · " attr(data-un);color:var(--muted)}
.opts{display:flex;gap:4px;flex-wrap:nowrap}
.opts input{position:absolute;opacity:0;width:1px;height:1px}
.opts label{display:grid;place-items:center;min-width:64px;padding:7px 6px;border:1px solid var(--rule);background:var(--surface);border-radius:6px;cursor:pointer;font-size:.78rem;text-align:center;line-height:1.2;color:var(--ink-2)}
.opts label:hover{border-color:var(--accent)}
.opts input:checked + label{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.opts input:focus-visible + label{outline:2px solid var(--focus);outline-offset:2px}
@media (max-width:760px){
  .q{grid-template-columns:1fr}
  .opts{flex-wrap:wrap}
  .opts label{min-width:0;flex:1 1 0}
}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:.86rem;color:var(--ink-2);cursor:pointer}

/* Profile */
.section{margin-top:30px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
.composites{display:grid;gap:18px}
.comp{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) 5.5rem;gap:6px 18px;align-items:center}
.comp .name{font-weight:650}
.comp .desc{font-size:.8rem;color:var(--muted)}
.val{text-align:right}
.val b{font-family:var(--mono);font-weight:500;font-size:1.15rem;font-variant-numeric:tabular-nums}
.val span{display:block;font-size:.74rem;color:var(--muted)}
.meter{position:relative;height:14px}
.meter .bands{position:absolute;inset:0;display:flex;gap:2px}
.meter .bands i{display:block;height:100%}
.meter .bands i:nth-child(1){background:var(--b0);border-radius:4px 0 0 4px}
.meter .bands i:nth-child(2){background:var(--b1)}
.meter .bands i:nth-child(3){background:var(--b2)}
.meter .bands i:nth-child(4){background:var(--b3);border-radius:0 4px 4px 0}
.meter .pin{position:absolute;top:-5px;width:12px;height:24px;margin-left:-6px;border-radius:4px;background:var(--pin);box-shadow:0 0 0 2px var(--surface)}
.meter.empty .pin{display:none}
.meter.small{height:10px}
.meter.small .pin{top:-4px;height:18px;width:10px;margin-left:-5px}
.axis{position:relative;height:16px;font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-top:4px}
.axis span{position:absolute;transform:translateX(-50%)}
.axis span:first-child{transform:none}
.axis span:last-child{transform:translateX(-100%)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.78rem;color:var(--ink-2);margin-top:14px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
@media (max-width:640px){
  .comp{grid-template-columns:minmax(0,1fr) auto}
  .comp .meter-wrap{grid-column:1 / -1;grid-row:2}
}

.screens{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.screen{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;display:grid;gap:8px;align-content:start}
.screen .big{font-family:var(--mono);font-size:1.6rem;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2);width:max-content}
.chip.hit{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.dgroup{margin-top:26px}
.dgroup h3{margin-bottom:6px}
.drow{display:grid;grid-template-columns:minmax(0,14rem) minmax(0,1fr) 7.5rem;gap:4px 18px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.drow .dn{font-weight:600;font-size:.93rem}
.drow .dm{font-size:.76rem;color:var(--muted)}
.drow .val b{font-size:.98rem}
@media (max-width:640px){
  .drow{grid-template-columns:minmax(0,1fr) auto}
  .drow .meter-wrap{grid-column:1 / -1;grid-row:2}
}

/* Method */
.method{display:grid;gap:26px;margin-top:26px}
.method p,.method li{max-width:72ch;color:var(--ink-2)}
.method ul,.method ol{margin:8px 0 0;padding-left:1.2em;display:grid;gap:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:640px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--sunk)}
tr:last-child td{border-bottom:0}
.refs li{font-size:.86rem}
.refs .k{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.foot{margin-top:40px;font-size:.82rem;color:var(--muted);max-width:72ch}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.status{font-size:.82rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div>
      <p class="eyebrow" id="t-eyebrow"></p>
      <h1 id="t-h1"></h1>
      <p class="lede" id="t-lede"></p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Form" id="seg-form">
        <button type="button" id="form-adult" data-form="adult" aria-pressed="true"></button>
        <button type="button" id="form-child" data-form="child" aria-pressed="false"></button>
      </div>
      <div class="row-actions">
        <div class="seg" role="group" aria-label="Language / Nyelv" id="seg-lang">
          <button type="button" id="lang-en" data-lang="en" lang="en" aria-pressed="true">English</button>
          <button type="button" id="lang-hu" data-lang="hu" lang="hu" aria-pressed="false">Magyar</button>
        </div>
        <button type="button" class="ghost" id="btn-example"></button>
        <button type="button" class="ghost" id="btn-clear"></button>
      </div>
    </div>
  </div>

  <div class="notice" id="example-notice" hidden>
    <span id="t-exnotice"></span>
    <button type="button" class="ghost" id="btn-clear-2"></button>
  </div>
  <div class="notice" id="confirm-clear" hidden>
    <span id="t-confirm"></span>
    <span class="row-actions"><button type="button" class="ghost" id="btn-clear-yes"></button><button type="button" class="ghost" id="btn-clear-no"></button></span>
  </div>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-questions" aria-selected="true" data-tab="questions"></button>
    <button type="button" role="tab" id="tab-profile" aria-selected="false" data-tab="profile"></button>
    <button type="button" role="tab" id="tab-method" aria-selected="false" data-tab="method"></button>
  </div>

  <section id="pane-questions" role="tabpanel" aria-labelledby="tab-questions">
    <div class="progress"><div class="bar"><i id="prog-bar"></i></div><span class="count mono" id="prog-count"></span><button type="button" class="ghost" id="btn-to-profile"></button></div>
    <div style="display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center;margin-top:16px">
      <p class="fine" id="instructions" style="max-width:62ch"></p>
      <label class="toggle"><input type="checkbox" id="show-src"> <span id="t-showsrc"></span></label>
    </div>
    <div id="questions"></div>
    <div style="margin-top:24px"><button type="button" class="ghost" id="btn-to-profile-2"></button></div>
  </section>

  <section id="pane-profile" role="tabpanel" aria-labelledby="tab-profile" hidden>
    <div id="profile"></div>
  </section>

  <section id="pane-method" role="tabpanel" aria-labelledby="tab-method" hidden>
    <div id="method" class="method"></div>
  </section>

  <p class="foot" id="t-foot"></p>
</div>
<script>
(function(){
"use strict";

/* ---------- Instruments & references ---------- */
const REFS = {
  DSM5:   "American Psychiatric Association (2013; text rev. 2022). Diagnostic and Statistical Manual of Mental Disorders, 5th ed. (DSM-5-TR). ADHD criterion A1 (inattention) and A2 (hyperactivity–impulsivity); Autism Spectrum Disorder criteria A and B; Specific Learning Disorder; Developmental Coordination Disorder.",

  ASRS5:  "Ustun B, Adler LA, Rudin C, et al. (2017). The World Health Organization Adult Attention-Deficit/Hyperactivity Disorder Self-Report Screening Scale for DSM-5. JAMA Psychiatry, 74(5), 520–527.",
  BAARS:  "Barkley RA (2011). Barkley Adult ADHD Rating Scale-IV (BAARS-IV). New York: Guilford Press.",
  BDEFS:  "Barkley RA (2011). Barkley Deficits in Executive Functioning Scale (BDEFS). New York: Guilford Press. Five factors: time management, organisation/problem-solving, self-restraint, self-motivation, emotion regulation.",
  BRIEF:  "Gioia GA, Isquith PK, Guy SC, Kenworthy L (2015). BRIEF-2: Behavior Rating Inventory of Executive Function, 2nd ed. Lutz, FL: PAR. Adult form: Roth RM, Isquith PK, Gioia GA (2005), BRIEF-A.",

  UPPS:   "Whiteside SP, Lynam DR (2001). The Five Factor Model and impulsivity: using a structural model of personality to understand impulsivity (UPPS). Personality and Individual Differences, 30(4), 669–689.",
  VAND:   "Wolraich ML, Lambert W, Doffing MA, et al. (2003). Psychometric properties of the Vanderbilt ADHD Diagnostic Parent Rating Scale in a referred population. Journal of Pediatric Psychology, 28(8), 559–567.",
  SNAP:   "Bussing R, Fernandez M, Harwood M, et al. (2008). Parent and teacher SNAP-IV ratings of attention deficit hyperactivity disorder symptoms: psychometric properties and normative ratings from a school district sample. Assessment, 15(3), 317–328.",

  BONDU:  "Bondü R, Esser G (2015). Justice and rejection sensitivity in children and adolescents with ADHD symptoms. European Child & Adolescent Psychiatry, 24(2), 185–198.",
  AHQ:    "Hupfeld KE, Abagis TR, Shah P (2019). Living “in the zone”: hyperfocus in adult ADHD. ADHD Attention Deficit and Hyperactivity Disorders, 11(2), 191–208. (Adult Hyperfocus Questionnaire)",
  HFREV:  "Ashinoff BK, Abu-Akel A (2021). Hyperfocus: the forgotten frontier of attention. Psychological Research, 85(1), 1–19.",
  CDS:    "Becker SP, Willcutt EG, Leopold DR, et al. (2023). Report of a Work Group on Sluggish Cognitive Tempo: key research directions and a consensus change in terminology to Cognitive Disengagement Syndrome. Journal of the American Academy of Child & Adolescent Psychiatry, 62(6), 629–645.",
  SCTMA:  "Becker SP, Leopold DR, Burns GL, et al. (2016). The internal, external, and diagnostic validity of sluggish cognitive tempo: a meta-analysis and critical review. JAACAP, 55(3), 163–178.",
  SCTC:   "Penny AM, Waschbusch DA, Klein RM, Corkum P, Eskes G (2009). Developing a measure of sluggish cognitive tempo for children: content validity, factor structure, and reliability. Psychological Assessment, 21(3), 380–389.",

  AQC:    "Auyeung B, Baron-Cohen S, Wheelwright S, Allison C (2008). The Autism Spectrum Quotient: Children’s Version (AQ-Child). Journal of Autism and Developmental Disorders, 38(7), 1230–1240.",
  RAADS:  "Ritvo RA, Ritvo ER, Guthrie D, et al. (2011). The Ritvo Autism Asperger Diagnostic Scale-Revised (RAADS-R): a scale to assist the diagnosis of autism spectrum disorder in adults. Journal of Autism and Developmental Disorders, 41(8), 1076–1089.",
  SCQ:    "Rutter M, Bailey A, Lord C (2003). The Social Communication Questionnaire (SCQ). Los Angeles: Western Psychological Services.",
  SRS:    "Constantino JN, Gruber CP (2012). Social Responsiveness Scale, 2nd ed. (SRS-2). Los Angeles: Western Psychological Services.",
  CATQ:   "Hull L, Mandy W, Lai M-C, et al. (2019). Development and validation of the Camouflaging Autistic Traits Questionnaire (CAT-Q). Journal of Autism and Developmental Disorders, 49(3), 819–833. Factors: compensation, masking, assimilation.",
  WCC:    "Happé F, Frith U (2006). The weak coherence account: detail-focused cognitive style in autism spectrum disorders. Journal of Autism and Developmental Disorders, 36(1), 5–25.",
  TAS:    "Bagby RM, Parker JDA, Taylor GJ (1994). The twenty-item Toronto Alexithymia Scale — I. Item selection and cross-validation of the factor structure. Journal of Psychosomatic Research, 38(1), 23–32.",
  ALXA:   "Kinnaird E, Stewart C, Tchanturia K (2019). Investigating alexithymia in autism: a systematic review and meta-analysis. European Psychiatry, 55, 80–89.",

  DUNN:   "Dunn W (1997). The impact of sensory processing abilities on the daily lives of young children and their families: a conceptual model. Infants & Young Children, 9(4), 23–35. Adult form: Brown C, Dunn W (2002), Adolescent/Adult Sensory Profile.",
  SSP:    "McIntosh DN, Miller LJ, Shyu V, Dunn W (1999). Overview of the Short Sensory Profile (SSP). In W. Dunn, The Sensory Profile: Examiner’s Manual. San Antonio: Psychological Corporation.",
  GSQ:    "Robertson AE, Simmons DR (2013). The relationship between sensory sensitivity and autistic traits in the general population. Journal of Autism and Developmental Disorders, 43(4), 775–784. (Glasgow Sensory Questionnaire)",
  ARHQ:   "Lefly DL, Pennington BF (2000). Reliability and validity of the Adult Reading History Questionnaire. Journal of Learning Disabilities, 33(3), 286–296.",
  ADCL:   "Vinegrad M (1994). A revised adult dyslexia checklist. Educare, 48, 21–23.",

  ADC:    "Kirby A, Edwards L, Sugden D, Rosenblum S (2010). The development and standardization of the Adult Developmental Co-ordination Disorders/Dyspraxia Checklist (ADC). Research in Developmental Disabilities, 31(1), 131–139.",
  DCDQ:   "Wilson BN, Crawford SG, Green D, et al. (2009). Psychometric properties of the revised Developmental Coordination Disorder Questionnaire (DCDQ’07). Physical & Occupational Therapy in Pediatrics, 29(2), 182–202.",
  ASTLE:  "Astle DE, Holmes J, Kievit R, Gathercole SE (2022). Annual Research Review: The transdiagnostic revolution in neurodevelopmental disorders. Journal of Child Psychology and Psychiatry, 63(4), 397–417.",
  ROMM:   "Rommelse NNJ, Franke B, Geurts HM, Hartman CA, Buitelaar JK (2010). Shared heritability of attention-deficit/hyperactivity disorder and autism spectrum disorder. European Child & Adolescent Psychiatry, 19(3), 281–295."
};

/* ---------- Item banks ----------
   t: item text   r: reverse-scored   d: DSM-5 ADHD symptom ('IA' or 'HI')   a: ASRS Part A-style threshold */
const ADULT = {
  key:"adult", label:"Adult form", respondent:"yourself",
  scale:["Never","Rarely","Sometimes","Often","Very often"], often:3, dsmCut:5,
  instructions:"Answer for how you have usually been over the past 6 months — at work, at home and socially. If something was true in childhood but not now, answer for now. Takes about 15 minutes.",
  domains:[
   {id:"adhd", name:"Attention & activity", blurb:"The two DSM-5 ADHD symptom clusters. Each of the 18 DSM-5 symptoms has one item here, worded for adults following the WHO ASRS v1.1.", dims:[
    {id:"ina", name:"Inattention", what:"Sustaining attention, careless errors, listening, follow-through, organising, effortful tasks, losing things, distractibility, forgetfulness.", src:["DSM5","ASRS","ASRS5","BAARS"], items:[
      {t:"I make careless mistakes when work is boring or detailed — misreading numbers, skipping a line, missing a step.", d:"IA"},

/* index items */
for (const f of Object.values(FORMS)){
  f.dimList=[]; f.itemList=[]; let n=0;
  for (const dom of f.domains) for (const dim of dom.dims){
    dim.domain=dom; f.dimList.push(dim);
    dim.items.forEach((it,i)=>{ it.id=dim.id+(i+1); it.idx=i; it.dim=dim; it.n=++n; f.itemList.push(it); });
  }
  f.max=f.scale.length-1;
}

/* ---------- State ---------- */
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let formKey = (store.get("ndp:form")||"adult");
if (!FORMS[formKey]) formKey="adult";
let lang = store.get("ndp:lang") || ((navigator.language||"").toLowerCase().startsWith("hu") ? "hu" : "en");
if (!UI[lang]) lang="en";
let currentTab = "questions";
const state = {};
function exampleAnswers(key){
  const f=FORMS[key], lv=EXAMPLE_LEVELS[key], a={};
  let s=key==="adult"?7:11;
  const rnd=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  for (const it of f.itemList){
    const L=lv[it.dim.id] ?? .3;
    let v=Math.round(L*f.max + (rnd()-.5)*1.6);
    v=Math.max(0,Math.min(f.max,v));
    a[it.id]= it.r ? f.max-v : v;
  }
  return a;
}
function load(key){
  const saved=store.get("ndp:"+key);
  state[key]= saved && saved.answers ? saved : {answers:exampleAnswers(key), example:true};
}
function save(){ store.set("ndp:"+formKey,state[formKey]); }
load("adult"); load("child");

/* ---------- Language accessors ---------- */
const T = () => UI[lang];
const H = f => lang==="hu" ? HU[f.key] : null;
const fLabel = f => H(f) ? H(f).label : f.label;
const fScale = f => H(f) ? H(f).scale : f.scale;
const fInstr = f => H(f) ? H(f).instructions : f.instructions;
const domName = (f,d) => H(f) ? H(f).domains[d.id][0] : d.name;
const domBlurb = (f,d) => H(f) ? H(f).domains[d.id][1] : d.blurb;
const dimName = (f,d) => H(f) ? H(f).dims[d.id][0] : d.name;
const dimWhat = (f,d) => H(f) ? H(f).dims[d.id][1] : d.what;
const itemText = (f,it) => H(f) ? H(f).dims[it.dim.id][2][it.idx] : it.t;
const compName = (f,c) => H(f) ? H(f).comps[c.id][0] : c.name;
const compDesc = (f,c) => H(f) ? H(f).comps[c.id][1] : c.desc;
const band = p => p==null ? null : T().bands[BAND_TO.findIndex(t=>p<t)];

/* ---------- Scoring ---------- */
const scoreOf=(f,it,v)=> it.r ? f.max-v : v;
function dimScore(f,dim,ans){
  let sum=0,n=0;
  for (const it of dim.items){ const v=ans[it.id]; if (v==null) continue; sum+=scoreOf(f,it,v); n++; }
  return {n, total:dim.items.length, pct: n ? sum/(n*f.max)*100 : null};
}
function compute(){
  const f=FORMS[formKey], ans=state[formKey].answers, dims={};
  for (const d of f.dimList) dims[d.id]=dimScore(f,d,ans);
  const comps=f.composites.map(c=>{
    const ids = c.dims==="*" ? f.dimList.filter(d=>!d.coOccurring).map(d=>d.id) : c.dims;
    const vals=ids.map(i=>dims[i].pct).filter(v=>v!=null);
    return {...c, pct: vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null};
  });
  const dsm={IA:0,HI:0};
  let asrs=0, asrsN=0;
  for (const it of f.itemList){
    const v=ans[it.id];
    if (it.d && v!=null && v>=f.often) dsm[it.d]++;
    if (it.a){ asrsN++; if (v!=null && v>=it.a) asrs++; }
  }
  return {dims,comps,dsm,asrs,asrsN};
}

/* ---------- Render: questionnaire ---------- */
function renderQuestions(){
  const f=FORMS[formKey], ans=state[formKey].answers, t=T(), scale=fScale(f);
  $("#instructions").textContent=fInstr(f);
  let h="";
  for (const dom of f.domains){
    h+=`<section class="domain"><header><p class="eyebrow">${esc(t.domHead(dom.dims.length, dom.dims.reduce((a,d)=>a+d.items.length,0)))}</p><h2>${esc(domName(f,dom))}</h2><p>${esc(domBlurb(f,dom))}</p></header><div>`;
    for (const dim of dom.dims) for (const it of dim.items){
      const v=ans[it.id], txt=itemText(f,it);
      const tags=[dimName(f,dim)];
      if (it.r) tags.push(t.rev);
      if (it.d) tags.push(it.d==="IA"?t.dsmIA:t.dsmHI);
      if (it.a) tags.push(t.asrsItem);
      h+=`<div class="q${v==null?" unanswered":""}" id="q-${it.id}"><div class="qt"><span class="qn" data-un="${esc(t.unanswered)}">${formKey==="adult"?"Q":"C"}${it.n}</span><span>${esc(txt)}</span><span class="src">${esc(tags.join(" · "))} — ${esc(srcNames(dim.src))}</span></div><div class="opts" role="radiogroup" aria-label="${esc(txt)}">`;
      scale.forEach((lab,i)=>{
        const id=`${formKey}-${it.id}-${i}`;
        h+=`<input type="radio" name="${formKey}-${it.id}" id="${id}" value="${i}"${v===i?" checked":""}><label for="${id}">${esc(lab)}</label>`;
      });
      h+=`</div></div>`;
    }
    h+=`</div></section>`;
  }
  $("#questions").innerHTML=h;
  updateProgress();
}
function updateProgress(){
  const f=FORMS[formKey], ans=state[formKey].answers;
  const n=f.itemList.filter(it=>ans[it.id]!=null).length;
  $("#prog-bar").style.width=(n/f.itemList.length*100)+"%";
  $("#prog-count").textContent=T().answered(n,f.itemList.length);
  $("#example-notice").hidden=!state[formKey].example;
}
$("#questions").addEventListener("change",e=>{
  const t=e.target; if (t.type!=="radio") return;
  const id=t.name.slice(formKey.length+1);
  if (state[formKey].example){ state[formKey]={answers:{},example:false}; renderQuestions(); document.getElementById(t.id).checked=true; }
  state[formKey].answers[id]=+t.value;
  document.getElementById("q-"+id)?.classList.remove("unanswered");
  save(); updateProgress();
});

/* ---------- Render: profile ---------- */
function meter(pct,small){
  const w=[30,20,20,30].map(x=>`<i style="width:calc(${x}% - 1.5px)"></i>`).join("");
  return `<div class="meter${small?" small":""}${pct==null?" empty":""}" ${pct!=null?`title="${pct.toFixed(0)} / 100 · ${esc(band(pct))}"`:""}><div class="bands">${w}</div>${pct!=null?`<span class="pin" style="left:${Math.max(0,Math.min(100,pct))}%"></span>`:""}</div>`;
}
const AXIS=`<div class="axis"><span style="left:0">0</span><span style="left:30%">30</span><span style="left:50%">50</span><span style="left:70%">70</span><span style="left:100%">100</span></div>`;
const legend=()=>`<div class="legend">${T().bands.map((b,i)=>`<span><i style="background:var(--b${i})"></i>${esc(b)} <span class="mono">${BAND_RANGE[i]}</span></span>`).join("")}</div>`;

function renderProfile(){
  const f=FORMS[formKey], r=compute(), st=state[formKey], t=T(), scale=fScale(f);
  const answered=f.itemList.filter(it=>st.answers[it.id]!=null).length;
  let h="";
  h+=`<div class="section"><p class="eyebrow">${esc(t.profHead(fLabel(f),answered,f.itemList.length,st.example))}</p>
  <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:end;margin-top:6px"><h2>${esc(t.cumHead)}</h2><span class="row-actions"><button type="button" class="ghost" id="btn-copy">${esc(t.copy)}</button><span class="status" id="copy-status" role="status"></span></span></div>
  <p class="fine" style="margin-top:6px;max-width:70ch">${esc(t.cumNote)}</p>
  <div class="panel composites" style="margin-top:14px">`;
  for (const c of r.comps){
    h+=`<div class="comp"><div><div class="name">${esc(compName(f,c))}</div><div class="desc">${esc(compDesc(f,c))}</div></div><div class="meter-wrap">${meter(c.pct)}${c.overall?AXIS:""}</div><div class="val">${c.pct==null?`<b>—</b><span>${esc(t.noAnswers)}</span>`:`<b>${c.pct.toFixed(0)}</b><span>${esc(band(c.pct))}</span>`}</div></div>`;
  }
  h+=`${legend()}</div></div>`;

  const cut=f.dsmCut, oftenLab=scale[f.often], ia=r.dsm.IA, hi=r.dsm.HI;
  const pres = t.pres[ ia>=cut&&hi>=cut ? 0 : ia>=cut ? 1 : hi>=cut ? 2 : 3 ];
  h+=`<div class="section"><h2>${esc(t.scrHead)}</h2><p class="fine" style="margin-top:6px;max-width:70ch">${esc(t.scrNote(oftenLab))}</p><div class="screens" style="margin-top:14px">
   <div class="screen"><span class="eyebrow">${esc(t.ia)}</span><span class="big">${ia}<span class="fine"> / 9</span></span><span class="chip${ia>=cut?" hit":""}">${esc(ia>=cut?t.atOrAbove:t.below)}</span><span class="fine">${esc(t.thr(cut,formKey==="adult"))}</span></div>
   <div class="screen"><span class="eyebrow">${esc(t.hi)}</span><span class="big">${hi}<span class="fine"> / 9</span></span><span class="chip${hi>=cut?" hit":""}">${esc(hi>=cut?t.atOrAbove:t.below)}</span><span class="fine">${esc(t.thrShort(cut))} ${esc(t.pattern)}: <strong>${esc(pres)}</strong>.</span></div>`;
  if (formKey==="adult"){
    const pos=r.asrs>=4;
    h+=`<div class="screen"><span class="eyebrow">${esc(t.asrsHead)}</span><span class="big">${r.asrs}<span class="fine"> / ${r.asrsN}</span></span><span class="chip${pos?" hit":""}">${esc(pos?t.asrsPos:t.asrsNeg)}</span><span class="fine">${esc(t.asrsNote)}</span></div>`;
  } else {
    const opp=r.dims.opp;
    h+=`<div class="screen"><span class="eyebrow">${esc(t.oppHead)}</span><span class="big">${opp.pct==null?"—":opp.pct.toFixed(0)}<span class="fine"> / 100</span></span><span class="chip${opp.pct!=null&&opp.pct>=50?" hit":""}">${esc(opp.pct==null?t.noAnswers:band(opp.pct))}</span><span class="fine">${esc(t.oppNote)}</span></div>`;
  }
  h+=`</div><p class="fine" style="margin-top:10px;max-width:72ch">${esc(t.diag)} ${esc(formKey==="child"?t.diagChild:t.diagAdult)}</p></div>`;

  h+=`<div class="section"><h2>${esc(t.dimHead)}</h2><p class="fine" style="margin-top:6px">${esc(t.dimNote)}</p>`;

    }
    h+=`</div>`;
  }
  h+=`</div>`;
  $("#profile").innerHTML=h;
  $("#btn-copy").addEventListener("click",()=>copyText(r));

function copyText(r){
  const f=FORMS[formKey], t=T(), scale=fScale(f), L=[];
  L.push(`${t.txtTitle} — ${fLabel(f)}${state[formKey].example?t.txtExample:""}`);
  L.push("", t.txtCum);
  for (const c of r.comps) L.push(`  ${compName(f,c)}: ${c.pct==null?"—":c.pct.toFixed(0)+" ("+band(c.pct)+")"}`);
  L.push("", t.txtDsm(scale[f.often], r.dsm.IA, r.dsm.HI, f.dsmCut));
  if (formKey==="adult") L.push(t.txtAsrs(r.asrs));
  L.push("", t.txtDims);
  for (const dom of f.domains){ L.push(`  ${domName(f,dom)}`); for (const d of dom.dims){ const s=r.dims[d.id]; L.push(`    ${dimName(f,d)}: ${s.pct==null?"—":s.pct.toFixed(0)+" ("+band(s.pct)+")"} [${s.n}/${s.total} ${t.txtItems}]`); } }
  L.push("", t.txtFoot);
  const txt=L.join("\n"), status=$("#copy-status");
  const fallback=()=>{ status.textContent=t.copyBlocked; const pre=document.createElement("textarea"); pre.value=txt; pre.rows=12; pre.style.width="100%"; pre.style.marginTop="12px"; pre.readOnly=true; $("#profile").prepend(pre); pre.select(); };
  try{ navigator.clipboard.writeText(txt).then(()=>{status.textContent=t.copied;},fallback); }catch(e){ fallback(); }
}

  <div><h2>${esc(t.mLimits)}</h2><ul>${t.mLimitList.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
  <div><h2>${esc(t.mMap(fLabel(f)))}</h2><div class="tablewrap" style="margin-top:10px"><table><thead><tr>${t.mCols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div></div>
  <div><h2>${esc(t.mRefs)}</h2>${t.mRefsNote?`<p class="fine" style="margin-top:6px">${esc(t.mRefsNote)}</p>`:""}<ul class="refs">${[...used].map(k=>`<li><span class="k">${esc(srcNames([k]))}</span> — ${esc(REFS[k])}</li>`).join("")}</ul></div>`;
}

/* ---------- Wiring ---------- */
function renderAll(){ renderStatic(); renderQuestions(); renderProfile(); renderMethod(); }
function setTab(tab){
  currentTab=tab;
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));
  for (const p of ["questions","profile","method"]) document.getElementById("pane-"+p).hidden = p!==tab;
  if (tab==="profile") renderProfile();
  store.set("ndp:tab",tab);
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
document.querySelectorAll("#seg-form button").forEach(b=>b.addEventListener("click",()=>{ formKey=b.dataset.form; store.set("ndp:form",formKey); $("#confirm-clear").hidden=true; renderAll(); }));
document.querySelectorAll("#seg-lang button").forEach(b=>b.addEventListener("click",()=>{ lang=b.dataset.lang; store.set("ndp:lang",lang); renderAll(); }));
const toProfile=()=>{ setTab("profile"); window.scrollTo({top:0}); };
$("#btn-to-profile").addEventListener("click",toProfile);
$("#btn-to-profile-2").addEventListener("click",toProfile);
$("#btn-example").addEventListener("click",()=>{ state[formKey]={answers:exampleAnswers(formKey),example:true}; save(); renderAll(); });
$("#btn-clear").addEventListener("click",()=>{ $("#confirm-clear").hidden=false; });
const clearForm=()=>{ state[formKey]={answers:{},example:false}; save(); $("#confirm-clear").hidden=true; renderAll(); setTab("questions"); };
$("#btn-clear-2").addEventListener("click",clearForm);
$("#btn-clear-yes").addEventListener("click",clearForm);
$("#btn-clear-no").addEventListener("click",()=>{ $("#confirm-clear").hidden=true; });
$("#show-src").addEventListener("change",e=>{ $("#questions").classList.toggle("show-src",e.target.checked); });

renderAll();
const hash=location.hash.slice(1);
const savedTab=store.get("ndp:tab");
setTab(["questions","profile","method"].includes(hash)?hash:(state[formKey].example?"profile":(savedTab||"questions")));
})();
</script>
</body>
</html>
